name: Collect public space data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and archive raw sources
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, urllib.request
          from datetime import datetime, timezone

          sources = {
              "iss_position": "https://api.wheretheiss.at/v1/satellites/25544",
              "iss_omm": "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=JSON",
              "goes_integral_protons": "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-plot-6-hour.json",
          }
          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y%m%dT%H%M%SZ")
          folder = pathlib.Path("site/data/raw") / now.strftime("%Y/%m/%d")
          folder.mkdir(parents=True, exist_ok=True)
          index_path = pathlib.Path("site/data/archive-index.json")
          try:
              index = json.loads(index_path.read_text("utf-8"))
          except Exception:
              index = {"records": []}

          added = []
          for name, url in sources.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"EVA-Risk-Desk/1.0"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read()
                  parsed = json.loads(body.decode("utf-8"))
                  sha = hashlib.sha256(body).hexdigest()
                  wrapper = {
                      "source": name,
                      "source_url": url,
                      "retrieved_at": now.isoformat().replace("+00:00","Z"),
                      "sha256_payload": sha,
                      "payload": parsed,
                  }
                  path = folder / f"{name}_{stamp}.json"
                  path.write_text(json.dumps(wrapper, ensure_ascii=False, indent=2), "utf-8")
                  rec = {
                      "source": name,
                      "path": str(path).replace("site/",""),
                      "retrieved_at": wrapper["retrieved_at"],
                      "sha256_payload": sha,
                      "size_bytes": path.stat().st_size,
                  }
                  added.append(rec)
                  print("saved", path)
              except Exception as e:
                  print("source failed", name, repr(e))

          if added:
              index["generated_at"] = now.isoformat().replace("+00:00","Z")
              index["records"] = (added + index.get("records", []))[:5000]
              index_path.parent.mkdir(parents=True, exist_ok=True)
              index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2), "utf-8")
          PY
      - name: Commit new raw snapshots
        run: |
          git config user.name "eva-risk-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No new snapshots"
          else
            git commit -m "data: archive public telemetry snapshots"
            git push
          fi
